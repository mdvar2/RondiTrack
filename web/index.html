<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RondiTrack | Stokvel Dashboard</title>
    <script>
      // Apply the theme before React and CSS paint to prevent a light-mode flash.
      (function () {
        var theme = 'system';
        try {
          var stored = localStorage.getItem('ronditrack-theme');
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (_) { /* Storage can be blocked in private browsing. */ }
        var dark = theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
