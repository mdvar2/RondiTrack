
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ronditrack
      POSTGRES_USER: ronditrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ronditrack -d ronditrack"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    volumes:
      - ./:/src:ro
      - api_obj:/src/API/obj
      - domain_obj:/src/Domain/obj
      - infrastructure_obj:/src/Infrastructure/obj
      - api_bin:/src/API/bin
      - domain_bin:/src/Domain/bin
      - infrastructure_bin:/src/Infrastructure/bin
    environment:
      ConnectionStrings__RondiTrackDb: Host=db;Port=5432;Database=ronditrack;Username=ronditrack;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    command:
      - sh
      - -c
      - dotnet tool install --global dotnet-ef --version 10.0.1 && export PATH="$$PATH:/root/.dotnet/tools" && dotnet restore API/RondiTrack.csproj && dotnet ef database update --project Infrastructure --startup-project API
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ronditrack-api:dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      ConnectionStrings__RondiTrackDb: Host=db;Port=5432;Database=ronditrack;Username=ronditrack;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  api_obj:
  domain_obj:
  infrastructure_obj:
  api_bin:
  domain_bin:
  infrastructure_bin:
